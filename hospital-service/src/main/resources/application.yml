server:
  port: 8080

spring:
  application:
    name: hospital-service
  config:
    # 本地开发自动读取仓库根目录的 .env：本机 3306/6379 常被原生 MySQL/Redis 占用，
    # 容器映射在 3307/6380，靠 .env 统一指向容器，避免"后端连旧库、测试连新库"。
    # optional 表示文件不存在就跳过：Docker 容器和 CI 里没有 .env，靠 compose/actions 注入环境变量。
    # 两个路径覆盖两种工作目录：在 hospital-service 下启动用 ../.env，在仓库根启动用 .env
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:hospital}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3s
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  http:
    client:
      # 对应原手写客户端的 2s / 10s：模型卡住不能拖着 Tomcat 线程
      connect-timeout: 2s
      read-timeout: 10s
  ai:
    anthropic:
      # DeepSeek 的 Anthropic 兼容接口，Spring AI 会自动拼上 /v1/messages
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/anthropic}
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-flash}
          # deepseek-flash 会先输出 thinking 再输出正文，500 容易被思考耗尽导致正文被截断
          max-tokens: 1000
          temperature: 0
          # 关掉思考：Spring AI 会把 thinking 段当成正文返回，导致 JSON 解析失败
          thinking:
            type: disabled
    retry:
      # 默认重试 10 次，超时会被放大成几十秒；导诊失败直接走关键词兜底更快
      max-attempts: 1

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

hospital:
  jwt:
    # 生产环境请通过环境变量 JWT_SECRET 覆盖
    secret: ${JWT_SECRET:hospital-registration-system-jwt-secret-key-change-me-in-production-2026}
    # 开发期放宽到 30 天免得反复登录；上线前改回 2
    expire-hours: 720
    issuer: hospital-service
  admin:
    # 启动时若不存在该账号会自动创建管理员，生产环境务必用环境变量覆盖默认密码
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  level:
    com.hospital: info
