server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 接口转发：/api/order/list → http://app:8080/order/list
    # app 是 docker-compose 里后端的服务名，同一 compose 网络内按服务名解析，不能写 localhost
    # proxy_pass 末尾的 / 表示"用该 URI 替换掉匹配到的 /api/ 前缀"，
    # 与开发环境 vite proxy 的 rewrite(/^\/api/ -> '') 是同一回事。
    # 少了这个斜杠，后端收到的就是 /api/order/list，直接 404。
    location /api/ {
        proxy_pass http://app:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 前端用响应头 Date 校正本地时钟（退号/签到要卡时段边界），必须透传
        proxy_pass_header Date;
    }

    # history 模式路由：/patient/orders 在服务器上没有对应文件，
    # 找不到时回落 index.html，交给前端路由接管，否则刷新页面就是 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
